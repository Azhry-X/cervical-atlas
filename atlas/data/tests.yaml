- id: cervical-artery-dysfunction-ifompt
  type: info
  title: Cervical Artery Dysfunction — IFOMPT International Framework (2023)
  page: 1
  summary: IFOMPT International Framework (2023) clinical reasoning approach to vascular pathologies of the neck before orthopedic manual therapy.
  steps:
  - 'IFOMPT International Framework (2023): vascular pathologies of the neck are rare but must be considered; recognised mainly through history-taking and adapted physical examination.'
  - 'Positional VBI tests: sensitivity 0–57%, specificity 67–100%; "the premanipulative tests do not seem valid"; positional testing and craniovertebral ligament testing are excluded from the IFOMPT Framework.'
  - 'Symptom checklist in words (E): dizziness, diplopia, dysarthria, dysphagia, drop attacks, nausea, nystagmus, numbness, ataxia, new unusual one-sided neck / head pain.'
  positive: 'IFOMPT International Framework (2023): vascular pathologies of the neck are rare but must be considered; recognised mainly through history-taking and adapted physical examination.'
  interpretation: Do not rely on positional VBI testing; recognize potential arterial pathology through targeted history-taking (new unusual one-sided neck / head pain and ischaemic symptoms) and adapted neurological/vascular examination.
  metrics: 'Level: Guideline / M. Rushton 2023 JOSPT (Guideline): IFOMPT International Framework (2023). Hutting 2013 Man Ther & Hutting 2022 Musculoskelet Sci Pract (M): sensitivity 0–57%, specificity 67–100%; "the premanipulative tests do not seem valid"; positional testing and craniovertebral ligament testing are excluded from the IFOMPT Framework.'
