- id: radiculopathy-natural-course-wong
  type: info
  title: Cervical Radiculopathy Natural Course & Prognosis (Wong 2014)
  page: 2
  summary: Systematic review of the natural history and prognostic factors of cervical radiculopathy with non-operative management.
  steps:
  - Most patients experience substantial improvement within 4–6 months.
  - Complete recovery occurs in ≈ 83% of patients by 24–36 months.
  - Workers' compensation claim status is associated with a poorer prognosis.
  positive: substantial improvement within 4–6 months; complete recovery in ≈ 83% by 24–36 months; workers' compensation = poorer prognosis.
  interpretation: Favourable natural course supports structured non-operative care in the absence of progressive neurological deficit or myelopathy.
  metrics: 'Wong 2014 Spine J: substantial improvement within 4–6 months; complete recovery in ≈ 83% by 24–36 months; workers'' compensation = poorer prognosis.'
  evidence: M
  sources:
  - text: Wong 2014 Spine J
