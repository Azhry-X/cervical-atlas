  page: 7
  summary: Randomised controlled trials of C1–C2 self-sustained natural apophyseal glide (self-SNAG) and manipulative therapy + low-load exercise for cervicogenic headache.
  steps:
  - 'C1–C2 self-SNAG RCT (Hall 2007): FRT range +15° vs +5° placebo; headache index 31 vs 51 at 4 weeks, 24 vs 44 at 12 months; overall reduction 54%.'
  - 'Manipulation + exercise RCT (Jull 2002): both reduced headache frequency and intensity, maintained at 12 months; combined not significantly superior (10% more relieved).'
  - 'JOSPT CPG chronic headache: "cervical or cervicothoracic manipulation or mobilizations combined with shoulder girdle and neck stretching, strengthening, and endurance exercise".'
  positive: 'Hall 2007: FRT range +15° vs +5° placebo; headache index 31 vs 51 at 4 weeks, 24 vs 44 at 12 months; overall reduction 54% · Jull 2002: both reduced headache frequency and intensity, maintained at 12 months; combined not significantly superior (10% more relieved).'
  interpretation: Both C1–C2 self-SNAG mobilisation and cervical manipulative therapy / deep neck flexor exercise produce sustained 12-month reductions in cervicogenic headache.
