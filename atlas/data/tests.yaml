- id: flexion-rotation-test
  type: test
  title: Cervical Flexion-Rotation Test (FRT)
  page: 2
  video_url: https://www.youtube.com/watch?v=TziMAn77ZRU
  video_title: Flexion Rotation Test | Upper Cervical Spine Rotation
  summary: Upper cervical (C1–C2) passive rotation assessment in full cervical flexion for cervicogenic headache.
  steps:
  - With the patient supine and relaxed, passively flex the cervical spine fully to pre-tension the lower cervical segments.
  - Maintain full flexion and passively rotate the head left and right to end-feel or symptom reproduction.
  - Compare range, symmetry, and headache reproduction between left and right sides.
  positive: Sn 91%, Sp 90%, overall accuracy 91% (Ogince); Sn 90%, Sp 88%, κ 0.85, usable by inexperienced examiners (Hall).
  interpretation: High diagnostic accuracy and inter-examiner reliability for cervicogenic headache, including when performed by inexperienced examiners.
  metrics: 'Ogince 2007 Man Ther: Sn 91%, Sp 90%, overall accuracy 91%. Hall 2008 J Manipulative Physiol Ther: Sn 90%, Sp 88%, κ 0.85, usable by inexperienced examiners.'
  evidence: M
  sources:
  - text: Ogince 2007 Man Ther
    url: https://doi.org/10.1016/j.math.2006.06.016
    free_full_text: false
  - text: Hall 2008 J Manipulative Physiol Ther
    url: https://doi.org/10.1016/j.jmpt.2008.03.012
