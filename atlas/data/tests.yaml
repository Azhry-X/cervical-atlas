    free_full_text: false
  review_status: approved
- id: ultt-a
  type: test
  title: Upper Limb Tension Test A (ULTT A / Median Nerve Bias)
  page: 4
  video_url: https://www.youtube.com/watch?v=rir6x6Iiqc4
  video_title: All Upper Limb Tension Tests | ULTT | ULNT
  summary: Upper-limb neurodynamic test (median nerve / C5–C7 bias) with high sensitivity to rule out cervical radiculopathy.
  steps:
  - With the patient supine, sequentially apply scapular depression, shoulder abduction, forearm supination, wrist and finger extension, shoulder external rotation, and elbow extension.
  - Perform structural differentiation via contralateral or ipsilateral cervical lateral flexion.
  - 'To rule out radiculopathy: ULTT A is most useful alone (Wainner 2003 / Rubinstein 2007), or use 4 negative neurodynamic tests + negative arm squeeze to rule out (Thoomes 2018).'
  positive: 'ULTT A: Sn 0.97 (0.90–1.0), Sp 0.22 (0.12–0.33) (Rubinstein 2007 / Wainner 2003 data); ULTT high Sn, low Sp → negative rules out.'
  interpretation: High sensitivity (Sn 0.97, 0.90–1.0) and low specificity (Sp 0.22, 0.12–0.33) make a negative ULTT A the most useful single test to rule out cervical radiculopathy.
  metrics: 'Rubinstein 2007 Eur Spine J: ULTT high Sn, low Sp → negative rules out; ULTT A: Sn 0.97 (0.90–1.0), Sp 0.22 (0.12–0.33). Wainner 2003 Spine: ULTT A most useful to rule out. Thoomes 2018 Spine J: 4 negative neurodynamic tests + negative arm squeeze to rule out.'
  evidence: M
  sources:
  - text: Rubinstein 2007 Eur Spine J
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2200707/
    free_full_text: true
  - text: Wainner 2003 Spine
    url: https://doi.org/10.1097/00007632-200301010-00014
    free_full_text: false
  - text: Thoomes 2018 Spine J
    url: https://doi.org/10.1016/j.spinee.2017.08.241
    free_full_text: false
  review_status: approved
- id: shoulder-abduction-sign
  type: test
  title: Shoulder Abduction Sign (Bakody's Sign)
  page: 4
  video_url: https://www.youtube.com/watch?v=8_AHkiiPYS8
  video_title: Shoulder Abduction Sign | Cervical Nerve Root Pathology
  summary: Symptom-relief test in which placing the ipsilateral hand on top of the head reduces radicular arm pain.
  steps:
  - Instruct the seated patient to lift the symptomatic arm and rest the hand or forearm on top of the head.
  - Observe for reduction or relief of distal radicular arm pain or paresthesia.
  positive: 'shoulder abduction: Sn 0.17 (0.0–0.34), Sp 0.92 (0.85–0.99); low–moderate Sn, moderate–high Sp.'
  interpretation: High specificity (Sp 0.92, 0.85–0.99) but very low sensitivity (Sn 0.17, 0.0–0.34); also 1 of 5 items in the Raney cervical traction CPR.
  metrics: 'Rubinstein 2007 Eur Spine J (Wainner 2003 data): shoulder abduction test low–moderate Sn, moderate–high Sp; Sn 0.17 (0.0–0.34), Sp 0.92 (0.85–0.99).'
  evidence: M
  sources:
