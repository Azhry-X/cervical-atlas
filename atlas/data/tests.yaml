- id: acute-neck-pain-prognosis-hush
  type: info
  title: Acute Neck Pain Prognostic Trajectory (Hush 2011 Meta-Analysis)
  page: 2
  summary: Meta-analysis of the clinical course of acute idiopathic neck pain and disability over 12 months.
  steps:
  - 'Pain trajectory: 64 (61–67) at onset → 35 (32–38) at 6.5 weeks → 42 (39–45) at 12 months.'
  - 'Disability trajectory: 30 → 17 by 6.5 weeks, with no further improvement at 12 months.'
  - Counsel patients that rapid initial improvement occurs by 6.5 weeks, but residual or recurrent symptoms are common at 12 months.
  positive: pain 64 (61–67) at onset → 35 (32–38) at 6.5 weeks → 42 (39–45) at 12 months; disability 30 → 17 by 6.5 weeks, no further improvement at 12 months.
  interpretation: Most improvement in acute neck pain and disability occurs within the first 6.5 weeks, followed by a plateau through 12 months.
  metrics: 'Hush 2011 Arch Phys Med Rehabil: pain 64 (61–67) at onset → 35 (32–38) at 6.5 weeks → 42 (39–45) at 12 months; disability 30 → 17 by 6.5 weeks, no further improvement at 12 months.'
  evidence: H
