  type: info
  title: Cervical Manipulation vs Mobilisation (Gross 2015 Cochrane)
  page: 7
  summary: Cochrane systematic review comparing cervical spine manipulation and mobilisation for neck pain.
  steps:
  - Manipulation and mobilisation produce similar results for every outcome.
  - Because of rare but serious adverse events, research should focus on mobilisation.
  - 'JOSPT CPG acute mobility deficits: "should provide thoracic manipulation, a program of neck ROM exercises, and scapulothoracic and upper extremity strengthening"; "may provide cervical manipulation and/or mobilization".'
  positive: similar results for every outcome; because of rare but serious adverse events, research should focus on mobilisation.
  interpretation: Manipulation and mobilisation gave similar results for every outcome; because serious adverse events after manipulation are rare but possible, the review authors favour mobilisation.
  metrics: 'Gross 2015 Cochrane: similar results for every outcome; because of rare but serious adverse events, research should focus on mobilisation.'
  evidence: M
  sources:
