- id: collar-physio-kuijper
  type: info
  title: Semi-Hard Collar or Physiotherapy vs Wait-and-See in Recent Radiculopathy (Kuijper 2009)
  page: 6
  summary: Randomised controlled trial comparing semi-hard cervical collar + rest, 6 weeks physiotherapy + home exercise, and wait-and-see in recent-onset cervical radiculopathy.
  steps:
  - Collar + rest or 6 weeks physio + home exercise gave extra arm-pain reduction of 12 mm vs wait-and-see at 6 weeks.
  - 'Neck pain reduction at 6 weeks: −17 mm (collar) and −14 mm (physio) vs wait-and-see.'
  - 'JOSPT CPG acute radiating pain: "may provide mobilizing and stabilizing exercises, laser, and short-term use of a cervical collar"; OPTIMa: do not offer collar in NAD grades I–III.'
  positive: 'collar + rest or 6 weeks physio + home exercise: extra arm-pain reduction 12 mm vs wait-and-see at 6 weeks; neck pain −17 mm (collar), −14 mm (physio).'
  interpretation: In acute cervical radiculopathy, both 6 weeks of physiotherapy + home exercise and short-term collar + rest reduce arm and neck pain faster than wait-and-see over the first 6 weeks.
  metrics: 'Kuijper 2009 BMJ: collar + rest or 6 weeks physio + home exercise: extra arm-pain reduction 12 mm vs wait-and-see at 6 weeks; neck pain −17 mm (collar), −14 mm (physio).'
  evidence: H
  sources:
