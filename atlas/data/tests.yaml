  steps:
  - Ask the patient to identify up to 3 important activities they are unable to perform or are having difficulty with because of their neck problem.
  - Rate each activity from 0 (unable to perform) to 10 (able to perform at prior level) and average the items.
  positive: 'Radiculopathy (Young 2010): MDC PSFS 3.3, MCID PSFS 2.2.'
  interpretation: In cervical radiculopathy (Young 2010), MDC is 3.3 points and MCID is 2.2 points on the 0–10 scale.
  metrics: 'Young 2010 Am J Phys Med Rehabil (radiculopathy): MDC: PSFS 3.3; MCID: PSFS 2.2.'
