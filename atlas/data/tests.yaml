  review_status: approved
- id: arm-squeeze-test
  type: test
  title: Arm Squeeze Test
  page: 4
  summary: Middle-third upper-arm compression test used in combination with provocative and neurodynamic tests for cervical radiculopathy.
  steps:
  - Squeeze the middle third of the patient's upper arm (over the biceps/triceps brachial neurovascular bundle) and compare pain provocation with acromioclavicular/deltoid control sites.
  - 'Rule-in combination (Thoomes 2018): combine Spurling + axial traction + arm squeeze to rule in.'
  - 'Rule-out combination (Thoomes 2018): 4 negative neurodynamic tests + negative arm squeeze to rule out.'
  positive: combine Spurling + axial traction + arm squeeze to rule in; 4 negative neurodynamic tests + negative arm squeeze to rule out.
  interpretation: Use in combination with Spurling and axial traction to rule in, or with 4 negative neurodynamic tests to rule out cervical radiculopathy (Thoomes 2018).
  metrics: 'Arm squeeze test: used only in the Thoomes combinations (E). Thoomes 2018 Spine J (M): combine Spurling + axial traction + arm squeeze to rule in; 4 negative neurodynamic tests + negative arm squeeze to rule out.'
  evidence: E
  sources:
  - text: Thoomes 2018 Spine J
    url: https://doi.org/10.1016/j.spinee.2017.08.241
    free_full_text: false
  review_status: approved
- id: cleland-thoracic-manip-cpr
  type: test
  title: Thoracic Manipulation CPR (Cleland 2007 & Cleland 2010 Trial)
  page: 4
  video_url: https://www.youtube.com/watch?v=FsTE3czv98A
  video_title: Thoracic Spine Manipulation Clinical Prediction Rule
  summary: Clinical prediction rule derivation (Cleland 2007) and randomised validation trial (Cleland 2010) for thoracic spine manipulation in mechanical neck pain.
  steps:
  - 'Derivation (Cleland 2007): ≥ 3 of 6 variables: LR+ 5.5; success 54% → 86% (items: see original paper).'
  - 'Validation RCT (Cleland 2010): CPR NOT validated; however, thoracic manipulation + exercise > exercise alone for disability (all follow-ups) and pain at 1 week.'
  positive: '≥ 3 of 6 variables: LR+ 5.5; success 54% → 86% (items: see original paper). CPR NOT validated (Cleland 2010).'
  interpretation: 'Although the 6-variable CPR (items: see original paper) was NOT validated in the 2010 RCT, thoracic manipulation combined with exercise was superior to exercise alone for disability at all follow-ups and pain at 1 week.'
  metrics: 'Cleland 2007 Phys Ther (L): ≥ 3 of 6 variables: LR+ 5.5; success 54% → 86% (items: see original paper). Cleland 2010 Phys Ther (M): CPR NOT validated; but thoracic manipulation + exercise > exercise alone for disability (all follow-ups) and pain at 1 week.'
