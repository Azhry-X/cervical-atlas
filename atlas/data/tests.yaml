- id: cda-vs-acdf-wang
  type: info
  title: Cervical Disc Arthroplasty (CDA) vs ACDF (Wang 2020 Meta-Analysis)
  page: 5
  summary: Meta-analysis of long-term outcomes comparing cervical disc arthroplasty (CDA) and ACDF across 11 RCTs (3,505 patients).
  steps:
  - CDA achieved higher overall success (2.10, 1.70–2.59) compared with ACDF.
  - CDA had lower symptomatic adjacent-segment disease (0.46, 0.34–0.63) and lower secondary surgery (0.50, 0.29–0.87).
  - POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  positive: CDA higher overall success (2.10, 1.70–2.59); lower symptomatic adjacent-segment disease (0.46, 0.34–0.63) and secondary surgery (0.50, 0.29–0.87).
  interpretation: Across 11 RCTs (3,505 patients), CDA demonstrated higher overall success and lower rates of symptomatic adjacent-segment disease and secondary surgery than ACDF.
  metrics: 'Wang 2020 Orthop Surg (MA, 11 RCTs, 3,505 patients): CDA higher overall success (2.10, 1.70–2.59); lower symptomatic adjacent-segment disease (0.46, 0.34–0.63) and secondary surgery (0.50, 0.29–0.87).'
