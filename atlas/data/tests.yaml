- id: acdf-vs-physio-engquist-peolsson
  type: info
  title: ACDF + Physiotherapy vs Physiotherapy Alone (Engquist 2013/2017, Peolsson 2013)
  page: 5
  summary: Randomised controlled trial comparing anterior cervical decompression and fusion (ACDF) plus structured physiotherapy vs structured physiotherapy alone for cervical radiculopathy at 2 years and 5–8 years.
  steps:
  - '2-year clinical outcomes (Engquist 2013): more rapid improvement in first year; "better/much better" 87% vs 62% at 12 months (P < 0.05), 81% vs 69% at 24 months (P = 0.28); NDI not different (P = 0.23); both groups improved.'
  - 'Physical function (Peolsson 2013): no difference in neck ROM, neck muscle endurance or hand function; "a structured physiotherapy program should precede a decision for ACDF".'
  - '5–8 year follow-up (Engquist 2017): NDI reduced 21% (surgery) vs 11% (physio), p = 0.03; neck pain −39 mm vs −19 mm; arm pain no significant difference; "better/much better" 93% vs 62%.'
  positive: '"a structured physiotherapy program should precede a decision for ACDF" (Peolsson 2013).'
  interpretation: Because both groups improve and physical function / arm pain do not differ significantly, “a structured physiotherapy program should precede a decision for ACDF” (Peolsson 2013).
  metrics: 'Engquist 2013 Spine: "better/much better" 87% vs 62% at 12 months (P < 0.05), 81% vs 69% at 24 months (P = 0.28); NDI not different (P = 0.23). Peolsson 2013 Spine: no difference in neck ROM, neck muscle endurance or hand function; "a structured physiotherapy program should precede a decision for ACDF". Engquist 2017 J Neurosurg Spine (5–8 years): NDI reduced 21% (surgery) vs 11% (physio), p = 0.03; neck pain −39 mm vs −19 mm; arm pain no significant difference; "better/much better" 93% vs 62%.'
  evidence: H
  sources:
  - text: Engquist 2013 Spine
    url: https://doi.org/10.1097/BRS.0b013e31829ff095
    free_full_text: false
  - text: Peolsson 2013 Spine
    url: https://doi.org/10.1097/BRS.0b013e31826d2cbb
    free_full_text: false
  - text: Engquist 2017 J Neurosurg Spine
