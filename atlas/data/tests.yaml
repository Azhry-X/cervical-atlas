- id: raney-traction-cpr
  type: test
  title: Cervical Traction Clinical Prediction Rule (Raney 2009)
  page: 4
  summary: Five-item clinical prediction rule (not validated) identifying neck pain patients likely to benefit from intermittent mechanical cervical traction + exercise.
  steps:
  - 1. Peripheralisation with C4–7 mobility testing.
  - 2. + Shoulder abduction test.
  - 3. Age ≥ 55.
  - 4. + ULTT A.
  - 5. + Distraction test.
  positive: '5 items: peripheralisation with C4–7 mobility testing, + shoulder abduction test, age ≥ 55, + ULTT A, + distraction test. ≥ 3/5: LR+ 4.81 (2.17–11.4), success 44% → 79.2%; ≥ 4/5: LR+ 23.1 (2.5–227.9) → 94.8% (not validated).'
  interpretation: 'When ≥ 3/5 items are present, post-test probability of success increases from 44% to 79.2% (LR+ 4.81); when ≥ 4/5 are present, post-test probability reaches 94.8% (LR+ 23.1). Note: not validated.'
  metrics: 'Raney 2009 Eur Spine J: 5 items: peripheralisation with C4–7 mobility testing, + shoulder abduction test, age ≥ 55, + ULTT A, + distraction test. ≥ 3/5: LR+ 4.81 (2.17–11.4), success 44% → 79.2%; ≥ 4/5: LR+ 23.1 (2.5–227.9) → 94.8% (not validated).'
  evidence: L
  calculator:
    kind: formula
    decimals: 0
    value_label: Positive items (of 5) · Not validated (Raney 2009)
    expr: c1 + c2 + c3 + c4 + c5
    inputs:
    - heading: Raney 2009 cervical traction CPR (5 items — not validated)
    - key: c1
      type: check
      label: 1. Peripheralisation with C4–7 mobility testing
    - key: c2
      type: check
      label: 2. + Shoulder abduction test
    - key: c3
      type: check
      label: 3. Age ≥ 55
    - key: c4
      type: check
      label: 4. + ULTT A
    - key: c5
      type: check
      label: 5. + Distraction test
    outputs:
    - when: v >= 4
      text: '≥ 4/5 positive: LR+ 23.1 (2.5–227.9), success 44% → 94.8% (not validated)'
      tone: good
    - when: v == 3
      text: '≥ 3/5 positive: LR+ 4.81 (2.17–11.4), success 44% → 79.2% (not validated)'
      tone: good
    - when: v < 3
      text: '< 3/5 positive: below ≥ 3/5 threshold (pre-test success 44%; not validated)'
      tone: warn
  sources:
  - text: Raney 2009 Eur Spine J
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2899424/
    free_full_text: true
  review_status: approved
- id: ndi
  type: info
  title: Neck Disability Index (NDI)
  page: 4
  summary: 10-section condition-specific self-report questionnaire measuring neck-related disability (0–50 raw points or 0–100%).
  steps:
  - '10 sections, each scored 0–5: pain intensity, personal care, lifting, reading, headaches, concentration, work, driving, sleeping, recreation.'
  - 'Total 0–50; % = total × 2. If sections are unanswered: % = total / (5 × answered) × 100, with at least 8 answered.'
  - Compare change against population-specific MDC and MCID thresholds (mechanical neck pain vs cervical radiculopathy).
  positive: 'Mechanical neck pain (Cleland 2008): NDI ICC 0.50, MCID 19 percentage points · Radiculopathy (Young 2010): MDC 13.4, MCID 8.5 · Systematic review (MacDermid 2009): ICC 0.50–0.98; MDC ≈ 5/50 uncomplicated neck pain, up to 10/50 radiculopathy.'
  interpretation: 'In mechanical neck pain, MCID is 19 percentage points (Cleland 2008) and MDC is ≈ 5/50 (MacDermid 2009). In cervical radiculopathy, MDC is 13.4 and MCID is 8.5 (Young 2010), with MDC up to 10/50 (MacDermid 2009). In acute whiplash, baseline NDI > 14.5/50 predicts poorer outcome (Walton 2013). Note: the Young 2010 abstract does not state whether its NDI thresholds are on the 0–50 or 0–100% scale — check the original before applying them to the % score.'
  metrics: 'Cleland 2008 Arch Phys Med Rehabil (mechanical neck pain): NDI ICC 0.50; MCID NDI 19 percentage points. Young 2010 Am J Phys Med Rehabil (radiculopathy): MDC NDI 13.4; MCID NDI 8.5. MacDermid 2009 JOSPT (SR): ICC 0.50–0.98; MDC ≈ 5/50 uncomplicated neck pain, up to 10/50 radiculopathy.'
  evidence: M
  calculator:
    kind: formula
    decimals: 1
    value_label: NDI % score (0–100%; ≥ 8 of 10 sections required) · Mechanical MCID 19% (Cleland 2008) · Radiculopathy MDC 13.4, MCID 8.5 (Young 2010)
    expr: '([s1,s2,s3,s4,s5,s6,s7,s8,s9,s10].filter(Number.isFinite).length >= 8 ? ([s1,s2,s3,s4,s5,s6,s7,s8,s9,s10].filter(Number.isFinite).reduce((a,b)=>a+b,0) / (5 * [s1,s2,s3,s4,s5,s6,s7,s8,s9,s10].filter(Number.isFinite).length)) * 100 : NaN)'
