- id: upper-limb-neuro-screen-c5-t1
  type: test
  title: Upper-Limb Neurological Screen (C5–T1)
  page: 3
  summary: Root-by-root dermatome, myotome, and deep tendon reflex neurological examination for C5–T1 radiculopathy.
  steps:
  - 'C5: lateral arm sensation; shoulder abduction (deltoid) strength; biceps reflex.'
  - 'C6: lateral forearm, thumb, and index finger sensation; elbow flexion and wrist extension strength; brachioradialis reflex.'
  - 'C7: middle finger sensation; elbow extension and wrist flexion strength; triceps reflex.'
  - 'C8: ring and little finger sensation; thumb extension and finger flexion strength.'
  - 'T1: medial forearm/arm sensation; finger abduction and adduction (interossei) strength.'
  positive: Concordant dermatomal sensory loss, myotomal weakness, or diminished deep tendon reflex in a C5–T1 nerve root distribution (E).
  interpretation: Combine C5–T1 neurological examination with UMN / myelopathy screening (Hoffmann, inverted supinator, Babinski, gait) and neurodynamic/provocative tests.
  metrics: Expert anatomical/clinical neurological examination (E).
  evidence: E
  sources:
  - text: Blanpied 2017 JOSPT
    url: https://doi.org/10.2519/jospt.2017.0302
    free_full_text: false
  review_status: approved
- id: spurling-test
  type: test
  title: Spurling's Test
  page: 4
  video_url: https://www.youtube.com/watch?v=3ZSNdv0o0yk
  video_title: Spurling's Test | Cervical Radicular Syndrome
  summary: Foraminal compression provocative test to rule in cervical radiculopathy.
  steps:
  - With the patient seated, guide the cervical spine into lateral flexion (and extension/rotation per protocol) toward the symptomatic side.
  - If symptoms are not reproduced by positioning alone, apply gentle axial compression through the top of the head.
  - Combine Spurling + axial traction + arm squeeze to rule in cervical radiculopathy (Thoomes 2018).
  positive: 'Spurling A: Sn 0.50 (0.27–0.73), Sp 0.86 (0.77–0.94) (Rubinstein 2007 / Wainner 2003 data) · Sp 0.89–1.00; Sn 0.38–0.97 (Thoomes 2018).'
  interpretation: Low–moderate Sn, high Sp → positive test rules in cervical radiculopathy; combine Spurling + axial traction + arm squeeze to rule in.
  metrics: 'Rubinstein 2007 Eur Spine J: Spurling, traction/distraction and Valsalva: low–moderate Sn, high Sp → rule in; Spurling A: Sn 0.50 (0.27–0.73), Sp 0.86 (0.77–0.94). Thoomes 2018 Spine J: Sp 0.89–1.00; Sn 0.38–0.97; combine Spurling + axial traction + arm squeeze to rule in; 4 negative neurodynamic tests + negative arm squeeze to rule out.'
  evidence: M
  sources:
  - text: Rubinstein 2007 Eur Spine J
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2200707/
    free_full_text: true
  - text: Thoomes 2018 Spine J
    url: https://doi.org/10.1016/j.spinee.2017.08.241
    free_full_text: false
  review_status: approved
- id: cervical-distraction-test
  type: test
  title: Cervical Distraction Test
  page: 4
  video_url: https://www.youtube.com/watch?v=uLdzgd5snmw
  video_title: Cervical Distraction Test | Cervical Radicular Syndrome
  summary: Manual axial cervical traction relief test for cervical radiculopathy and the Raney traction CPR.
  steps:
  - With the patient supine, grasp beneath the occiput and chin/mastoid processes.
  - Apply a gradual manual axial distraction force and assess for reduction or centralization of radicular arm symptoms.
  positive: 'distraction: Sn 0.44 (0.21–0.67), Sp 0.90 (0.82–0.98) (Rubinstein 2007 / Wainner 2003 data).'
  interpretation: Low–moderate Sn (0.44), high Sp (0.90) → positive symptom relief helps rule in cervical radiculopathy and is 1 of 5 items in the Raney cervical traction CPR.
  metrics: 'Rubinstein 2007 Eur Spine J: traction/distraction low–moderate Sn, high Sp → rule in; distraction: Sn 0.44 (0.21–0.67), Sp 0.90 (0.82–0.98). Thoomes 2018 Spine J: combine Spurling + axial traction + arm squeeze to rule in.'
  evidence: M
  sources:
