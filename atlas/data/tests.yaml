- id: lllt-electrotherapy-neck
  type: info
  title: Low-Level Laser Therapy (Chow 2009) & Electrotherapy (Kroeling 2013 Cochrane)
  page: 6
  summary: Meta-analysis of low-level laser therapy (LLLT) and Cochrane systematic review of electrotherapy modalities for neck pain.
  steps:
  - 'Low-level laser (Chow 2009 Lancet, MA, 16 RCTs, 820 pts): acute: RR 1.69 (1.22–2.33); chronic: RR 4.05 (2.74–5.98); VAS −19.86 mm (10.04–29.68); follow-up 1–22 weeks −22.07 mm (17.42–26.72).'
  - 'Electrotherapy (Kroeling 2013 Cochrane, 20 trials): very low quality; TENS inconsistent; galvanic current, iontophoresis, EMS no better than placebo.'
  - 'JOSPT CPG: chronic mobility deficits may include "Dry needling, laser, or intermittent mechanical/manual traction" within a multimodal approach; WAD (low risk) and chronic WAD: may provide TENS.'
  positive: 'Chow 2009 LLLT: acute RR 1.69 (1.22–2.33); chronic RR 4.05 (2.74–5.98); VAS −19.86 mm (10.04–29.68); follow-up 1–22 weeks −22.07 mm (17.42–26.72) · Kroeling 2013: very low quality; TENS inconsistent; galvanic current, iontophoresis, EMS no better than placebo.'
  interpretation: Low-level laser reduced pain in acute and chronic neck pain in this meta-analysis (Chow 2009), whereas galvanic current, iontophoresis, and EMS are no better than placebo (Kroeling 2013).
  metrics: 'Chow 2009 Lancet (M, 16 RCTs, 820 pts): acute: RR 1.69 (1.22–2.33); chronic: RR 4.05 (2.74–5.98); VAS −19.86 mm (10.04–29.68); follow-up 1–22 weeks −22.07 mm (17.42–26.72). Kroeling 2013 Cochrane (L, 20 trials): very low quality; TENS inconsistent; galvanic current, iontophoresis, EMS no better than placebo.'
