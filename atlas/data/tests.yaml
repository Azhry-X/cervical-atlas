  interpretation: Stratify acute WAD patients early using baseline pain (> 5.5/10), NDI (> 14.5/50), age, and hyperarousal while providing active reassurance.
  metrics: 'Walton 2013 JOSPT (M): high baseline pain (> 5.5/10), NDI > 14.5/50, headache at inception, female sex, less than post-secondary education, WAD grade 2 or 3 (robust to publication bias). Ritchie 2013 Pain (L): ≈ 50% fully recover, 25% persistent moderate/severe pain and disability, 25% milder disability; WhipPredict CPR PPV 71%. Blanpied 2017 JOSPT (Guideline): "Reassurance to the patient that recovery is expected to occur within the first 2 to 3 months".'
