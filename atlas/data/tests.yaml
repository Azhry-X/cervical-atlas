  review_status: approved
- id: valsalva-test
  type: test
  title: Valsalva Manoeuvre
  page: 4
  summary: Intrathecal pressure provocation test for cervical radiculopathy.
  steps:
  - Instruct the seated patient to take a breath and bear down against a closed glottis.
  - Record whether radicular upper-extremity pain or paresthesia is reproduced.
  positive: 'Valsalva: Sn 0.22 (0.03–0.41), Sp 0.94 (0.88–1.0); low–moderate Sn, high Sp → rule in.'
  interpretation: High specificity (Sp 0.94, 0.88–1.0) helps rule in cervical radiculopathy when positive, whereas low sensitivity (Sn 0.22, 0.03–0.41) cannot rule it out.
  metrics: 'Rubinstein 2007 Eur Spine J (Wainner 2003 data): Valsalva low–moderate Sn, high Sp → rule in; Sn 0.22 (0.03–0.41), Sp 0.94 (0.88–1.0).'
  evidence: M
  sources:
