- id: whiplash-prognosis-walton-ritchie
  type: info
  title: Whiplash (WAD) Prognostic Predictors & WhipPredict CPR
  page: 2
  summary: Prognostic risk factors, clinical course, and the WhipPredict clinical prediction rule after acute whiplash injury.
  steps:
  - 'Walton 2013 poor-outcome predictors: high baseline pain (> 5.5/10), NDI > 14.5/50, headache at inception, female sex, less than post-secondary education, WAD grade 2 or 3 (robust to publication bias).'
  - 'Ritchie 2013 course + WhipPredict CPR: ≈ 50% fully recover, 25% persistent moderate/severe pain and disability, 25% milder disability; WhipPredict CPR PPV 71% (older age + high NDI + hyperarousal → chronic; younger + low NDI → recovery).'
  - 'CPG WAD recovery advice: "Reassurance to the patient that recovery is expected to occur within the first 2 to 3 months".'
