  title: JOSPT Neck Pain Clinical Practice Guideline (Blanpied 2017)
  page: 1
  summary: 'APTA Orthopaedic Section / JOSPT clinical practice guideline for neck pain: serious pathology triage, 4-category classification, examination sets, outcome measures, and multimodal intervention recommendations.'
  steps:
  - 'Serious pathology screen: "Clinicians should perform assessments … to determine the potential for the presence of serious pathology (eg, infection, cancer, cardiac involvement, arterial insufficiency, upper cervical ligamentous insufficiency, unexplained cranial nerve dysfunction or fracture), and refer for consultation as indicated."'
  - 'CPG classification: neck pain with mobility deficits · with movement coordination impairments (including WAD) · with headaches (cervicogenic) · with radiating pain (radicular).'
  - 'Outcome measures: "Clinicians should use validated self-report questionnaires … to identify a patient''s baseline status and to monitor changes relative to pain, function, disability, and psychosocial functioning."'
  - 'WAD recovery advice: "Reassurance to the patient that recovery is expected to occur within the first 2 to 3 months".'
  positive: '"Clinicians should perform assessments … to determine the potential for the presence of serious pathology (eg, infection, cancer, cardiac involvement, arterial insufficiency, upper cervical ligamentous insufficiency, unexplained cranial nerve dysfunction or fracture), and refer for consultation as indicated."'
  interpretation: Classify patients after excluding serious pathology and match interventions to the specific CPG subgroup and chronicity stage.
  metrics: 'Level: Guideline. Blanpied 2017 JOSPT neck pain CPG: serious pathology screen, 4-category classification, exam sets, validated outcome questionnaires, and stage-specific intervention recommendations.'
