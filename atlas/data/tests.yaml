- id: cervical-traction-evidence
  type: info
  title: Mechanical Cervical Traction + Exercise Evidence (Graham 2008, Fritz 2014, Romeo 2018)
  page: 6
  summary: Cochrane review, randomised trial, and meta-analysis of mechanical cervical traction combined with exercise/physiotherapy for cervical radiculopathy.
  steps:
  - 'Graham 2008 Cochrane: no low-risk-of-bias evidence that clearly supports or refutes continuous or intermittent traction.'
  - 'Fritz 2014 RCT (radiculopathy): NDI lower at 6 months with mechanical traction vs exercise alone (MD 13.3, 5.6–21.0) and vs over-door traction (8.1, 0.8–15.3); at 12 months vs exercise (9.8, 0.2–19.4).'
  - 'Romeo 2018 MA (traction + PT): mechanical traction: pain g −0.85 (−1.63 to −0.06) short term, −1.17 (−2.25 to −0.10) intermediate; disability g −1.05 (−1.81 to −0.28) intermediate.'
  - 'JOSPT CPG chronic radiating pain: "should provide mechanical intermittent cervical traction, combined with other interventions such as stretching and strengthening exercise plus cervical and thoracic mobilization/manipulation".'
  positive: 'Fritz 2014: NDI MD 13.3 (5.6–21.0) at 6 months, 9.8 (0.2–19.4) at 12 months vs exercise alone · Romeo 2018: pain g −0.85 short term, −1.17 intermediate; disability g −1.05 intermediate.'
  interpretation: Standalone traction lacks low-risk-of-bias support (Graham 2008), but mechanical traction combined with exercise/PT improves pain and disability in cervical radiculopathy (Fritz 2014, Romeo 2018, Blanpied 2017 CPG).
  metrics: 'Graham 2008 Cochrane (M): no low-risk-of-bias evidence that clearly supports or refutes continuous or intermittent traction. Fritz 2014 JOSPT (M): NDI lower at 6 months with mechanical traction vs exercise alone (MD 13.3, 5.6–21.0) and vs over-door traction (8.1, 0.8–15.3); at 12 months vs exercise (9.8, 0.2–19.4). Romeo 2018 Phys Ther (M): mechanical traction: pain g −0.85 (−1.63 to −0.06) short term, −1.17 (−2.25 to −0.10) intermediate; disability g −1.05 (−1.81 to −0.28) intermediate.'
  evidence: M
