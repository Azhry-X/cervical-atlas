- id: quebec-task-force-wad
  type: info
  title: Quebec Task Force (QTF) Whiplash-Associated Disorders (WAD) Grades 0–IV
  page: 1
  summary: Quebec Task Force clinical classification of Whiplash-Associated Disorders (WAD) from Grade 0 to Grade IV.
  steps:
  - 'WAD Grade 0: no complaint about the neck; no physical sign(s).'
  - 'WAD Grade I: neck complaint of pain, stiffness, or tenderness only; no physical sign(s).'
  - 'WAD Grade II: neck complaint AND musculoskeletal sign(s) (decreased range of motion and point tenderness).'
  - 'WAD Grade III: neck complaint AND neurological sign(s) (decreased or absent deep tendon reflexes, weakness, and sensory deficits).'
  - 'WAD Grade IV: neck complaint AND fracture or dislocation.'
  positive: Quebec Task Force grades 0–IV (see steps for each grade).
  interpretation: WAD Grade IV requires fracture/dislocation trauma management; WAD Grade 2 or 3 is a predictor of poorer outcome in Walton 2013.
  metrics: 'Spitzer 1995 Spine: Quebec Task Force grades 0–IV (see steps for each grade).'
  evidence: E
  sources:
  - text: Spitzer 1995 Spine
    url: https://pubmed.ncbi.nlm.nih.gov/7604354/
    free_full_text: false
  review_status: approved
