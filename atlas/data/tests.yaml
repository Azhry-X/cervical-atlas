- id: canadian-c-spine-rule
  type: test
  title: Canadian C-Spine Rule (CCR)
  page: 1
  video_url: https://www.youtube.com/watch?v=F4AbC9FQ-sA
  video_title: Canadian C-Spine Rule | Cervical Spine Fractures
  summary: Three-question clinical decision rule to determine the need for cervical spine radiography in alert, stable trauma patients.
  steps:
  - 'Question 1 — High-risk factor: age ≥ 65 years, dangerous mechanism, or paresthesias in extremities → image.'
  - 'Question 2 — Low-risk factor: simple rear-end MVC, sitting in ED, ambulatory at any time, delayed onset of neck pain, or no midline tenderness → allows ROM assessment.'
  - 'Question 3 — Active rotation: able to actively rotate neck 45° left and right → no imaging.'
  positive: '3 questions: (1) high-risk factor (age ≥ 65 years, dangerous mechanism, or paresthesias in extremities) → image; (2) low-risk factor (simple rear-end MVC, sitting in ED, ambulatory at any time, delayed onset of neck pain, or no midline tenderness) allows ROM assessment; (3) able to actively rotate neck 45° left and right → no imaging.'
  interpretation: 'Derivation: Sn 100% (98–100%), Sp 42.5% (40–44%). Validation vs NEXUS: Sn 99.4% vs 90.7%; Sp 45.1% vs 36.8%; radiography rates 55.9% vs 66.6% (all P < 0.001).'
  metrics: 'Stiell 2001 JAMA: Sn 100% (98–100%), Sp 42.5% (40–44%). Stiell 2003 NEJM (CCR vs NEXUS validation): Sn 99.4% vs 90.7%; Sp 45.1% vs 36.8%; radiography rates 55.9% vs 66.6% (all P < 0.001).'
  evidence: H
  sources:
  - text: Stiell 2001 JAMA
    url: https://doi.org/10.1001/jama.286.15.1841
    free_full_text: false
  - text: Stiell 2003 NEJM
    url: https://doi.org/10.1056/NEJMoa031375
    free_full_text: false
  review_status: approved
- id: nexus-criteria
  type: test
  title: NEXUS Low-Risk Criteria
  page: 1
  summary: National Emergency X-Radiography Utilization Study (NEXUS) low-risk decision instrument to rule out cervical spine injury after blunt trauma.
  steps:
  - Assess for absence of posterior midline cervical tenderness, normal alertness, no evidence of intoxication, no focal neurological deficit, and no painful distracting injury.
  - Compare with Canadian C-Spine Rule validation performance when selecting a trauma clearance protocol.
  positive: Sn 99.0% (98.0–99.6%); Sp 12.9%; NPV 99.8%.
  interpretation: NEXUS has high sensitivity (Sn 99.0%, NPV 99.8%) and lower specificity (Sp 12.9%); in head-to-head validation CCR had higher sensitivity and specificity (Sn 99.4% vs 90.7%; Sp 45.1% vs 36.8%; radiography rates 55.9% vs 66.6%, all P < 0.001).
  metrics: 'Hoffman 2000 NEJM: Sn 99.0% (98.0–99.6%); Sp 12.9%; NPV 99.8%. Stiell 2003 NEJM (CCR vs NEXUS): Sn 99.4% vs 90.7%; Sp 45.1% vs 36.8%; radiography rates 55.9% vs 66.6% (all P < 0.001).'
  evidence: H
  sources:
  - text: Hoffman 2000 NEJM
    url: https://doi.org/10.1056/NEJM200007133430203
    free_full_text: false
  - text: Stiell 2003 NEJM
    url: https://doi.org/10.1056/NEJMoa031375
    free_full_text: false
  review_status: approved
