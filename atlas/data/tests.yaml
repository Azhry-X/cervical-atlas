- id: dysphagia-after-acdf-xue
  type: info
  title: Dysphagia After ACDF & Post-Op Red-Flag Re-Check (Xue 2022)
  page: 5
  summary: Risk factors and resolution timeline for dysphagia after Zero-P ACDF (n = 260) and mandatory post-operative safety re-check.
  steps:
  - 'Risk factors for dysphagia after ACDF (Zero-P cohort, n = 260): more operated levels, longer operation time, larger dC2–7 angle change and dPSTT.'
  - 'Resolution of dysphagia cases: 37.1% resolved by 3 months, 38.6% by 6 months, 17.1% by 12 months.'
  - 'Post-op re-check (E): swallowing / airway, voice, new arm weakness, wound, neuro change → contact surgeon.'
  positive: 'risk factors: more operated levels, longer operation time, larger dC2–7 angle change and dPSTT; of dysphagia cases 37.1% resolved by 3 months, 38.6% by 6 months, 17.1% by 12 months.'
  interpretation: Screen every post-operative visit for airway/swallowing compromise, voice change, new arm weakness, wound signs, or neurological deterioration and contact the surgeon immediately if present.
  metrics: 'Xue 2022 Orthop Surg (Zero-P cohort, n = 260): risk factors: more operated levels, longer operation time, larger dC2–7 angle change and dPSTT; of dysphagia cases 37.1% resolved by 3 months, 38.6% by 6 months, 17.1% by 12 months.'
  evidence: L
