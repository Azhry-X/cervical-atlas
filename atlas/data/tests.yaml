- id: positional-vbi-tests
  type: test
  title: Positional VBI Tests (Excluded from IFOMPT Framework)
  page: 1
  summary: Diagnostic validity of pre-manipulative positional vertebrobasilar insufficiency (VBI) tests and their exclusion from the IFOMPT International Framework.
  steps:
  - 'Do not rely on pre-manipulative positional extension-rotation tests to clear the cervical arteries: "the premanipulative tests do not seem valid".'
  - Positional testing and craniovertebral ligament testing are excluded from the IFOMPT Framework.
  - Rely on careful vascular history-taking, risk-factor review, and cranial nerve / neurological examination.
  positive: sensitivity 0–57%, specificity 67–100%; "the premanipulative tests do not seem valid"; positional testing and craniovertebral ligament testing are excluded from the IFOMPT Framework.
  interpretation: Because sensitivity is 0–57% (specificity 67–100%), a negative positional VBI test cannot rule out cervical arterial pathology.
  metrics: 'Hutting 2013 Man Ther & Hutting 2022 Musculoskelet Sci Pract: sensitivity 0–57%, specificity 67–100%; "the premanipulative tests do not seem valid"; positional testing and craniovertebral ligament testing are excluded from the IFOMPT Framework.'
  evidence: M
  sources:
