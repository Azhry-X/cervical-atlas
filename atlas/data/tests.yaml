- id: nprs
  type: info
  title: Numeric Pain Rating Scale (NPRS)
  page: 4
  summary: 11-point (0–10) numeric pain intensity scale for mechanical neck pain and cervical radiculopathy.
  steps:
  - Ask the patient to rate pain intensity from 0 (no pain) to 10 (worst imaginable pain) for current, best, and worst pain over the past 24 hours.
  - 'Compare change against population-specific thresholds: mechanical neck pain MCID 1.3 (Cleland 2008); cervical radiculopathy MDC 4.1, MCID 2.2 (Young 2010).'
  positive: 'Mechanical neck pain (Cleland 2008): NPRS ICC 0.76, MCID 1.3 · Radiculopathy (Young 2010): MDC 4.1, MCID 2.2.'
  interpretation: In mechanical neck pain, ICC is 0.76 and MCID is 1.3 points (Cleland 2008). In cervical radiculopathy, MDC is 4.1 and MCID is 2.2 points (Young 2010). In acute whiplash, baseline pain > 5.5/10 predicts poorer outcome (Walton 2013).
  metrics: 'Cleland 2008 Arch Phys Med Rehabil (mechanical neck pain): NPRS ICC 0.76; MCID NPRS 1.3. Young 2010 Am J Phys Med Rehabil (radiculopathy): MDC NPRS 4.1; MCID NPRS 2.2.'
  evidence: M
