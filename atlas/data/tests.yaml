- id: cook-myelopathy-cluster
  type: test
  title: Cervical Myelopathy Clinical Cluster (Cook 2010)
  page: 1
  summary: Five-item clinical test cluster to rule out or rule in cervical spine myelopathy against MRI cord signal/compression.
  steps:
  - 1. Gait deviation (wide-based, ataxic, or unsteady gait).
  - 2. + Hoffmann's sign.
  - 3. Inverted supinator sign.
  - 4. + Babinski sign.
  - 5. Age > 45 y.
  positive: '5 items: gait deviation, + Hoffmann, inverted supinator sign, + Babinski, age > 45 y. ≤ 1 of 5 positive: LR− 0.18 (0.12–0.42) → rules out; ≥ 3 of 5: LR+ 30.9 (5.5–181.8), post-test 94%; 4 of 5: post-test 99+% (pre-test 35%).'
  interpretation: Nearly all single myelopathy tests are specific but poorly sensitive → poor screening tools alone (Cook 2011). Using the 5-item cluster, ≤ 1 of 5 positive helps rule out (LR− 0.18), while ≥ 3 of 5 (LR+ 30.9, post-test 94%) or 4 of 5 (post-test 99+%) strongly rules in cervical myelopathy.
  metrics: 'Cook 2010 J Man Manip Ther: ≤ 1 of 5 positive: LR− 0.18 (0.12–0.42) → rules out; ≥ 3 of 5: LR+ 30.9 (5.5–181.8), post-test 94%; 4 of 5: post-test 99+% (pre-test 35%). Single tests: inverted supinator sign LR+ 29.1 (5.1–171.5); Achilles hyperreflexia 7.8 (2.5–25.4); quadriceps hyperreflexia 6.9 (2.8–17.5); Hoffmann LR+ 4.9 (2.6–9.6); age > 45 y LR− 0.48 (0.26–0.85). Cook 2011 J Manipulative Physiol Ther: nearly all tests specific but poorly sensitive → poor screening tools alone.'
  evidence: M
  calculator:
    kind: formula
    decimals: 0
    value_label: Positive items (of 5) · Pre-test 35% (Cook 2010)
    expr: c1 + c2 + c3 + c4 + c5
    inputs:
    - heading: Cook 2010 cervical myelopathy cluster (5 items; pre-test 35%)
    - key: c1
      type: check
      label: 1. Gait deviation
    - key: c2
      type: check
      label: 2. + Hoffmann
    - key: c3
      type: check
      label: 3. Inverted supinator sign
    - key: c4
      type: check
      label: 4. + Babinski
    - key: c5
      type: check
      label: 5. Age > 45 y
    outputs:
    - when: v >= 4
      text: '4 of 5 (or 5 of 5) positive (pre-test 35%): ≥ 3 of 5 LR+ 30.9 (5.5–181.8); 4 of 5: post-test 99+%'
      tone: bad
    - when: v == 3
      text: '≥ 3 of 5 positive (pre-test 35%): LR+ 30.9 (5.5–181.8), post-test 94%'
      tone: bad
    - when: v == 2
      text: '2 of 5 positive (pre-test 35%): indeterminate — examine further'
      tone: warn
    - when: v <= 1
      text: '≤ 1 of 5 positive (pre-test 35%): LR− 0.18 (0.12–0.42) → rules out'
      tone: good
  sources:
  - text: Cook 2010 J Man Manip Ther
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3113267/
    free_full_text: true
  - text: Cook 2011 J Manipulative Physiol Ther
    url: https://doi.org/10.1016/j.jmpt.2011.08.008
    free_full_text: false
  review_status: approved
- id: hoffmann-sign
  type: test
  title: Hoffmann's Sign
  page: 1
  video_url: https://www.youtube.com/watch?v=uVI55amnVuk
  video_title: Hoffmann's Sign or Reflex | Upper Motor Neuron Lesion
  summary: Upper motor neuron reflex test evaluating corticospinal tract dysfunction in suspected cervical myelopathy.
  steps:
  - Support the patient's relaxed hand with the wrist in slight dorsiflexion and fingers partially flexed.
  - Stabilise the middle finger proximal to the distal interphalangeal joint and briskly flick the distal phalanx into flexion.
  - Observe for reflex flexion and adduction of the thumb and/or flexion of the index finger.
  positive: 'Hoffmann LR+ 4.9 (2.6–9.6) (Cook 2010); vs cord compression: Sn 58%, Sp 78% (Glaser 2001).'
  interpretation: Useful for ruling in upper motor neuron involvement as part of the Cook 5-item myelopathy cluster, but poorly sensitive as a standalone screen.
  metrics: 'Cook 2010 J Man Manip Ther (M): Hoffmann LR+ 4.9 (2.6–9.6). Glaser 2001 Iowa Orthop J (L): Sn 58%, Sp 78% vs cord compression.'
  evidence: M
  sources:
  - text: Cook 2010 J Man Manip Ther
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3113267/
    free_full_text: true
  - text: Glaser 2001 Iowa Orthop J
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1888193/
    free_full_text: true
  review_status: approved
- id: inverted-supinator-sign
  type: test
  title: Inverted Supinator Sign (Brachioradialis Reflex)
  page: 1
  video_url: https://www.youtube.com/watch?v=_H5Pv8istcI
  video_title: Inverted Supinator Sign | Upper Motor Neuron Lesion
  summary: Pathological upper motor neuron reflex response during brachioradialis tendon percussion in suspected cervical myelopathy.
  steps:
  - Support the patient's forearm in neutral rotation and slight elbow flexion.
  - Briskly tap the distal brachioradialis tendon near the radial styloid.
  - Observe for finger flexion and/or slight elbow extension with diminished brachioradialis reflex.
  positive: inverted supinator sign LR+ 29.1 (5.1–171.5).
  interpretation: Highest positive likelihood ratio among single myelopathy signs in Cook 2010 (LR+ 29.1, 5.1–171.5); interpret within the 5-item Cook myelopathy cluster.
  metrics: 'Cook 2010 J Man Manip Ther: inverted supinator sign LR+ 29.1 (5.1–171.5).'
  evidence: M
  sources:
  - text: Cook 2010 J Man Manip Ther
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3113267/
    free_full_text: true
  review_status: approved
- id: babinski-hyperreflexia-myelopathy
  type: test
  title: Babinski Sign, Hyperreflexia & Gait Myelopathy Screen
  page: 1
  summary: Single upper motor neuron signs and systematic review synthesis for cervical myelopathy screening.
  steps:
  - Observe gait for wide-based, unsteady, or spastic gait deviation.
  - Test plantar response (Babinski sign) and lower-limb deep tendon reflexes (quadriceps and Achilles hyperreflexia).
  - Combine with Hoffmann's sign, inverted supinator sign, and age > 45 y in the 5-item Cook cluster.
  positive: inverted supinator sign LR+ 29.1 (5.1–171.5); Achilles hyperreflexia 7.8 (2.5–25.4); quadriceps hyperreflexia 6.9 (2.8–17.5); Hoffmann LR+ 4.9 (2.6–9.6); age > 45 y LR− 0.48 (0.26–0.85).
  interpretation: 'Myelopathy tests (SR, Cook 2011): nearly all tests specific but poorly sensitive → poor screening tools alone.'
  metrics: 'Cook 2010 J Man Manip Ther: inverted supinator sign LR+ 29.1 (5.1–171.5); Achilles hyperreflexia 7.8 (2.5–25.4); quadriceps hyperreflexia 6.9 (2.8–17.5); Hoffmann LR+ 4.9 (2.6–9.6); age > 45 y LR− 0.48 (0.26–0.85). Cook 2011 J Manipulative Physiol Ther: nearly all tests specific but poorly sensitive → poor screening tools alone.'
  evidence: M
  sources:
