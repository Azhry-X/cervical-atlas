    free_full_text: false
  review_status: approved
- id: cervical-segmental-mobility-ppt-hhd
  type: test
  title: Segmental Mobility, Pressure Pain Threshold (PPT) & HHD
  page: 3
  summary: JOSPT CPG physical examination components for cervical/thoracic segmental mobility, algometric pressure pain threshold, and isometric strength.
  steps:
  - 'Mobility deficits: assess AROM, flexion-rotation test, and cervical/thoracic segmental mobility.'
  - 'Headache: assess AROM, FRT, and upper cervical mobility.'
  - 'Radiating pain: assess neurodynamic tests, Spurling, distraction, and Valsalva.'
  - 'Coordination: assess cranial cervical flexion + neck flexor endurance tests; algometric pressure pain threshold; hand-held dynamometry as a write-in measure.'
  positive: 'mobility deficits: AROM, flexion-rotation test, cervical/thoracic segmental mobility; headache: AROM, FRT, upper cervical mobility; radiating: neurodynamic, Spurling, distraction, Valsalva; coordination: cranial cervical flexion + neck flexor endurance tests; algometric pressure pain threshold.'
  interpretation: Use the CPG examination set matched to the patient's primary classification category.
