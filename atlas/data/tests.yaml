- id: cervical-arom-rondoni
  type: test
  title: Active Cervical Range of Motion (AROM) Reliability (Rondoni 2017)
  page: 3
  summary: Systematic review and meta-analysis comparing intrarater and inter-rater reliability of inexpensive vs expensive active cervical ROM measurement devices.
  steps:
  - Measure active cervical flexion, extension, left/right rotation, and left/right lateral flexion (side-bending) in a standardised seated posture.
  - Intrarater ICC 0.93 (inexpensive) vs 0.91 (expensive devices); inter-rater 0.80 vs 0.87 → expensive devices add no reliability.
  - Note that side-bending is the least reliable movement plane.
  positive: intrarater ICC 0.93 (inexpensive) vs 0.91 (expensive devices); inter-rater 0.80 vs 0.87 → expensive devices add no reliability; side-bending least reliable.
  interpretation: Inexpensive clinical instruments achieve high intrarater (ICC 0.93) and inter-rater (ICC 0.80) reliability; expensive 3D/electrogoniometric devices add no reliability.
  metrics: 'Rondoni 2017 J Manipulative Physiol Ther: intrarater ICC 0.93 (inexpensive) vs 0.91 (expensive devices); inter-rater 0.80 vs 0.87 → expensive devices add no reliability; side-bending least reliable.'
  evidence: M
  sources:
  - text: Rondoni 2017 J Manipulative Physiol Ther
    url: https://doi.org/10.1016/j.jmpt.2017.07.002
    free_full_text: false
  review_status: approved
- id: craniocervical-flexion-test
  type: test
  title: Craniocervical Flexion Test (CCFT)
  page: 3
  video_url: https://www.youtube.com/watch?v=cAfcQIRm9Ew
  video_title: Craniocervical Flexion Test / CCFT | Deep Cervical Neck Flexors
  summary: Low-load motor control assessment of deep cervical flexor (longus capitis and longus colli) activation and isometric endurance using a pressure biofeedback unit.
  steps:
  - Position the patient in crook lying with the craniocervical spine in neutral and place the folded pressure biofeedback cuff suboccipitally.
  - Guide the patient to perform a gentle craniocervical nod across 5 progressive pressure stages (pressure biofeedback) testing deep cervical flexor activation and endurance.
  - Monitor for superficial sternocleidomastoid or scalene substitution, head retraction, or jerky pressure loss.
  positive: 5 progressive pressure stages (pressure biofeedback) testing deep cervical flexor activation and endurance.
  interpretation: Identifies motor control impairment and reduced endurance of the deep cervical flexors in neck pain, WAD, and cervicogenic headache.
  metrics: 'Jull 2008 J Manipulative Physiol Ther: 5 progressive pressure stages (pressure biofeedback) testing deep cervical flexor activation and endurance.'
  evidence: E
  sources:
  - text: Jull 2008 J Manipulative Physiol Ther
    url: https://doi.org/10.1016/j.jmpt.2008.08.003
    free_full_text: false
  review_status: approved
- id: neck-flexor-endurance-test
  type: test
  title: Deep Neck Flexor (DNF) Endurance Test
  page: 3
  video_url: https://www.youtube.com/watch?v=0JEWM_McBmM
  video_title: Neck Flexor Endurance Test | Deep Neck Flexors
  summary: Clinical endurance test of the deep cervical flexor muscles in supine hook-lying.
  steps:
  - Position the patient in supine hook-lying with the chin maximally tucked (craniocervical flexion).
  - Instruct the patient to lift the head slightly off the plinth while maintaining the craniocervical nod.
  - Terminate the test when the skin folds separate due to loss of chin tuck, the head touches the clinician's hand, or symptoms limit holding — record the hold time and compare with the patient’s own baseline.
  positive: Record hold time and compare with the patient’s own baseline over visits.
  interpretation: Recommended in the JOSPT CPG coordination examination set alongside the craniocervical flexion test; compare serial within-patient hold times.
  metrics: 'Deep neck flexor endurance test: no published norm used — compare with the patient’s own baseline (E). Blanpied 2017 JOSPT (Guideline): coordination exam set includes cranial cervical flexion + neck flexor endurance tests.'
  evidence: E
  sources:
  - text: Blanpied 2017 JOSPT
    url: https://doi.org/10.2519/jospt.2017.0302
    free_full_text: false
  review_status: approved
- id: cervical-joint-position-error
  type: test
  title: Cervical Joint Position Error (JPE) & Proprioception
  page: 3
  summary: Head-to-neutral relocation test assessing cervicalafferent proprioceptive deficit and sensorimotor control.
  steps:
  - Seat the patient facing a wall target with a head-mounted laser pointer and establish the natural neutral head posture.
  - Blindfold the patient, instruct them to actively rotate or flex/extend the head and return as accurately as possible to the starting neutral position.
  - Assess relocation error across trials.
  positive: 'proprioceptive deficit in neck pain (Revel); abnormal rotation JPE: PPV 88% but Sn 60%, Sp 54% for balance problems in WAD.'
  interpretation: Demonstrates proprioceptive deficit in neck pain (Revel 1991); in WAD, abnormal rotation JPE has PPV 88% but Sn 60%, Sp 54% for balance problems (Treleaven 2006).
  metrics: 'Revel 1991 Arch Phys Med Rehabil & Treleaven 2006 Man Ther: proprioceptive deficit in neck pain (Revel); abnormal rotation JPE: PPV 88% but Sn 60%, Sp 54% for balance problems in WAD.'
  evidence: L
