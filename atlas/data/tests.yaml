- id: sharp-purser-test
  type: test
  title: Sharp-Purser Test
  page: 1
  video_url: https://www.youtube.com/watch?v=9mbXER7QtNM
  video_title: Sharp Purser Test | Transverse Ligament Integrity
  summary: Clinical test for atlantoaxial instability and transverse ligament insufficiency (studied in rheumatoid arthritis).
  steps:
  - With the patient seated and neck semi-flexed, stabilise the spinous process of C2 with a pinch grip.
  - Apply a gentle posterior translation force through the forehead while monitoring for a clunky relocation or symptom reduction.
  - 'Cautions: positional testing and craniovertebral ligament testing are excluded from the IFOMPT Framework; do not provoke cord compression.'
  positive: Sp 96%; Sn 88% when subluxation > 4 mm.
  interpretation: In rheumatoid arthritis (Uitvlugt 1988), Sp 96% and Sn 88% when subluxation > 4 mm. Note that craniovertebral ligament testing is excluded from the IFOMPT Framework (Hutting 2022).
  metrics: 'Uitvlugt 1988 Arthritis Rheum (L): Sp 96%; Sn 88% when subluxation > 4 mm. Hutting 2013 Phys Ther (M): 5 studies; specificity sufficient, sensitivity variable; membrane tests best — no pooled numbers.'
  evidence: L
  sources:
